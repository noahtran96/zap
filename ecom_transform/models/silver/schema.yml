version: 2

models:
  - name: cln_users
    description: "Cleaned and deduplicated user records in the Silver layer"
    columns:
      - name: user_id
        description: "Primary key for users"
        tests:
          - unique
          - not_null
      - name: email
        description: "Normalized lowercase email address"
        tests:
          - not_null

  - name: cln_products
    description: "Cleaned and standardized product catalog in the Silver layer"
    columns:
      - name: product_id
        description: "Primary key for products"
        tests:
          - unique
          - not_null
      - name: unit_price
        description: "Standardized product unit price"
        tests:
          - not_null

  - name: cln_orders
    description: "Cleaned and standardized order headers in the Silver layer"
    columns:
      - name: order_id
        description: "Primary key for orders"
        tests:
          - unique
          - not_null
      - name: user_id
        description: "Foreign key referencing cln_users"
        tests:
          - not_null

  - name: cln_order_items
    description: "Cleaned order line items with calculated line totals"
    columns:
      - name: order_item_id
        description: "Primary key for order items"
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Foreign key referencing cln_orders"
        tests:
          - not_null
      - name: product_id
        description: "Foreign key referencing cln_products"
        tests:
          - not_null
